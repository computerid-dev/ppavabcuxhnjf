<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060d1c"><title>Masuk - ESPORTKU</title><script src="js/guard.js"></script><link rel="stylesheet" href="css/style.css?v=20261121a"></head>
<body><header class="top" id="top"></header><main class="shell"><div class="panel auth"><div class="tabs"><button class="on" data-m="in">Masuk</button><button data-m="up">Daftar Pengelola</button></div><form id="f" novalidate><label for="u">Username</label><input id="u" autocomplete="username" maxlength="20"><div id="up" class="hidden"><label for="n">Nama pengelola / penyelenggara</label><input id="n" maxlength="40"><label for="k">PIN aktivasi (dari admin)</label><input id="k" autocomplete="off" maxlength="20"></div><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><p id="err" class="hidden" style="color:var(--bad)"></p><p><button class="btn" id="go" type="submit">Masuk</button></p></form></div></main><script type="module" src="js/login.js"></script></body></html>
